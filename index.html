<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日一部好电影</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1 class="site-title">每日推荐 · 一部好电影</h1>
      <div class="date-nav">
        <button class="nav-btn" id="prev-day" aria-label="前一天">‹</button>
        <div class="date-wrap">
          <p class="date" id="date"></p>
          <button class="today-btn" id="today-btn" hidden>回到今天</button>
        </div>
        <button class="nav-btn" id="next-day" aria-label="后一天">›</button>
      </div>
    </header>

    <section class="card" id="card">
      <!-- 由 app.js 渲染 -->
    </section>

    <footer class="page-footer">
      <p>数据来源：豆瓣 Top 250 · 烂番茄 Top 100 · TMDB</p>
      <p class="tip">每天一部 · 按日期确定，点箭头可翻看往日推荐</p>
    </footer>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
