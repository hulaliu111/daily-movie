<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日一部好电影</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1 class="site-title">每日推荐 · 一部好电影</h1>
      <div class="date-nav">
        <button class="nav-btn" id="prev-day" aria-label="前一天">‹</button>
        <div class="date-wrap">
          <p class="date" id="date"></p>
          <button class="today-btn" id="today-btn" hidden>回到今天</button>
        </div>
        <button class="nav-btn" id="next-day" aria-label="后一天">›</button>
      </div>
      <button class="library-btn" id="library-btn" type="button">浏览全部片库</button>
    </header>

    <section class="card" id="card">
      <!-- 由 app.js 渲染 -->
    </section>

    <section class="collection" id="collection" hidden></section>

    <section class="random-section">
      <h2 class="random-title">想看点别的？</h2>

      <div class="random-actions">
        <button class="random-btn big" data-kind="any" type="button">随便来一部</button>
        <button class="random-btn big" data-kind="cold" type="button">冷门佳作</button>
      </div>

      <div class="random-group">
        <span class="random-label">按类型</span>
        <div class="random-tags">
          <button class="random-tag" data-type="爱情" type="button">爱情</button>
          <button class="random-tag" data-type="喜剧" type="button">喜剧</button>
          <button class="random-tag" data-type="科幻" type="button">科幻</button>
          <button class="random-tag" data-type="悬疑" type="button">悬疑</button>
          <button class="random-tag" data-type="犯罪" type="button">犯罪</button>
          <button class="random-tag" data-type="动画" type="button">动画</button>
          <button class="random-tag" data-type="动作" type="button">动作</button>
          <button class="random-tag" data-type="战争" type="button">战争</button>
        </div>
      </div>

      <div class="random-group">
        <span class="random-label">按年代</span>
        <div class="random-tags">
          <button class="random-tag" data-decade="1990" type="button">90年代</button>
          <button class="random-tag" data-decade="2000" type="button">00年代</button>
          <button class="random-tag" data-decade="2010" type="button">10年代</button>
          <button class="random-tag" data-decade="old" type="button">更早</button>
        </div>
      </div>

      <div class="random-result" id="random-result" hidden></div>
    </section>

    <section class="chart-section" id="chart" hidden></section>

    <footer class="page-footer">
      <p>数据来源：豆瓣 Top 250 · TMDB</p>
      <p class="tip">每天一部 · 按日期确定，点箭头可翻看往日推荐</p>
      <p class="disclaimer">本站仅供学习交流、非商业用途；影片数据、海报与文字介绍版权归原作者及来源平台（豆瓣、TMDB）所有。</p>
    </footer>
  </main>

  <div class="library-overlay" id="library-overlay" hidden>
    <div class="library-panel">
      <div class="library-head">
        <h2 class="library-title">全部片库</h2>
        <button class="library-close" id="library-close" type="button" aria-label="关闭">×</button>
      </div>
      <input class="library-search" id="library-search" type="search" placeholder="搜索片名 / 导演 / 演员">
      <div class="library-filters">
        <div class="library-row">
          <span class="library-label">类型</span>
          <div class="library-tags" id="library-genres"></div>
        </div>
        <div class="library-row">
          <span class="library-label">年代</span>
          <div class="library-tags" id="library-decades"></div>
        </div>
        <div class="library-row">
          <span class="library-label">排序</span>
          <div class="library-tags" id="library-sort"></div>
        </div>
      </div>
      <p class="library-count" id="library-count"></p>
      <div class="library-grid" id="library-grid"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
